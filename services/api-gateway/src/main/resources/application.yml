spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1

        - id: question-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/questions/**
          filters:
            - StripPrefix=1

        - id: reputation-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/reputation/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
